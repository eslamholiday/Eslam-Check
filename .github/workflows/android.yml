name: Build Eslam Check APK
on:
  workflow_dispatch:
  push:
    branches: [ main, bridge-v0.2, v0.3-audit-upgrade, v0.4-smart-audit, v0.4.1-passenger-merge, v0.4.2-review-flow, v0.4.3-receipts-smart-delete, v0.4.4-responsibility-review-fix, export-source-v0.4.4 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eslam-check-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Eslam-Check-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Eslam-Check-v0.4.4-source
          path: |
            app
            gradle
            gradlew
            gradlew.bat
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            README.md
            .github
          if-no-files-found: warn
