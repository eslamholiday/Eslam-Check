name: Build Eslam Check APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, bridge-v0.2, v0.3-audit-upgrade, v0.4-smart-audit, v0.4.1-passenger-merge, v0.4.2-review-flow, v0.4.3-receipts-smart-delete, v0.4.4-responsibility-review-fix, v0.4.5-stars-commission-review-cards, v0.4.6-phone-visa-ux ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eslam-check-debug-keystore-v1
      - name: Ensure stable signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Eslam Check, OU=Eslam Holiday, O=Eslam Holiday, L=Baghdad, ST=Baghdad, C=IQ"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Eslam-Check-debug
          path: app/build/outputs/apk/debug/app-debug.apk
