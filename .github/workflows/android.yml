name: Build Eslam Check APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, bridge-v0.2, v0.3-audit-upgrade, v0.4-smart-audit, v0.4.1-passenger-merge, v0.4.2-review-flow, v0.4.3-receipts-smart-delete, v0.4.4-responsibility-review-fix, v0.4.5-stars-commission-review-cards, v0.4.6-phone-visa-ux, v0.5.0-periods-money-theme ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: eslam-check-stable-signing-v1
      - name: Ensure stable signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Saved signing key is unavailable; refusing to create an incompatible key."
            exit 1
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK uses the retained signing certificate
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/debug/retained-key.apk app/build/outputs/apk/debug/app-debug.apk
          mv app/build/outputs/apk/debug/retained-key.apk app/build/outputs/apk/debug/app-debug.apk
          expected=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$("$signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Expected certificate: $expected"
          echo "Actual certificate: $actual"
          test -n "$actual"
          test "$expected" = "$actual"
          echo "APK signature matches retained key: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: Eslam-Check-debug
          path: app/build/outputs/apk/debug/app-debug.apk

